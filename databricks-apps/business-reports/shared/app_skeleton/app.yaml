command: ["python", "app.py"]

oauth:
  user_api_scopes:
    - sql

env:
  - name: APP_ORG
    value: "finance"                      # override per org
  - name: DATABRICKS_WAREHOUSE_HTTP_PATH
    value: "/sql/1.0/warehouses/<warehouse-id>"
  - name: STATUS_CATALOG
    value: "your_catalog"
  - name: STATUS_SCHEMA
    value: "business_reports"

  - name: QUERY_CACHE_TTL_SECONDS
    value: "60"
