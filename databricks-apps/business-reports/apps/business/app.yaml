command: ["python", "app.py"]

oauth:
  user_api_scopes:
    - sql

resources:
  - name: sql-warehouse
    description: "Shared analytics warehouse"
    sql_warehouse:
      id: "0709f445a3d3d88a"
      permission: "CAN_USE"

env:
  - name: APP_ORG
    value: "business"
  - name: DATABRICKS_WAREHOUSE_ID
    valueFrom: sql-warehouse
  - name: STATUS_CATALOG
    value: "your_catalog"
  - name: STATUS_SCHEMA
    value: "business_reports"
  - name: QUERY_CACHE_TTL_SECONDS
    value: "60"
